<script id="th" type="text/plain">

<div class="gc mj">

<p class="lead">Deux façons de jouer à Greencut, avec les mêmes règles à la table. Vous pouvez passer de l’une à l’autre à tout moment.</p></div>

<script>

class Component extends DCLogic {
constructor(props) { super(props); const ab0 = GreencutEngine.settleAbandoned ? GreencutEngine.settleAbandoned() : ''; this.state = { menu: false, w: GreencutEngine.wallet.get(), msg: ab0 }; }
renderVals() {
const U = GreencutEngine.tour; const W = GreencutEngine.wallet; const f = (n) => U.fmt(n); const s = this.state; const C = U.cfg;
const T = U.load(); const me = U.standings(T, {}).me; const cp = U.canPlay(T); const ph = T.phase;
const tourStatus = ph > 4 ? (T.results && T.results.heroPos ? 'Résultats publiés : vous terminez ' + T.results.heroPos + (T.results.heroPos === 1 ? 'er' : 'e') + '.' : 'Résultats publiés.') : (!cp.ok ? cp.why : (me && me.thru ? 'Vous êtes ' + me.pos + ' à ' + me.tot + ' après ' + me.thru + ' tour' + (me.thru > 1 ? 's' : '') + '.' : 'Vous n’avez pas encore joué de carte.'));
const low = W.low(s.w);
return {
  ...this.navMenu(s.menu, () => this.setState({ menu: !this.state.menu })), solde: f(s.w.pts) + ' pts',
  classicHref: this.tourLink('classic'), tourHref: this.tourLink('tour'), tourName: C.name, dates: C.dates,
  statusChip: ph > 4 ? 'Terminé' : 'Tour ' + ph + ' en cours', statusCls: ph > 4 ? 'chip c-done' : 'chip c-live', tourStatus,
  ptsTxt: f(s.w.pts) + ' pts', feesTxt: f(s.w.fees) + ' fees', low, demoTxt: f(W.demo.pts) + ' pts · ' + f(W.demo.fees) + ' fees',
  walletNote: 'Le même solde sert aux deux modes. Chaque partie ou carte de tournoi engage une mise de 10 000 pts, avec votre accord ; sous 10 000 pts, vous convertissez 100 fees en 10 000 pts.',
  resetWallet: () => { const w = W.reset(); this.setState({ w, msg: 'Solde de démonstration remis : ' + f(w.pts) + ' pts et ' + f(w.fees) + ' fees.' }); },
  hasMsg: !!s.msg, msg: s.msg
};
}
}
GreencutEngine.install(Component);

GCMount({v:document.getElementById('tv').textContent,h:document.getElementById('th').textContent}, Component, document.getElementById('app'));
</script></body></html>
