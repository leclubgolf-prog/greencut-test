<div class="" style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{ok}}" as="c" hint-placeholder-count="2"><button class="cc {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}"><div style="display:flex;align-items:center;gap:10px"><span class="rk">{{c.rank}}</span><div style="min-width:0"><div class="cn">{{c.name}}</div><div class="cp">{{c.place}}</div></div></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><span class="ch g">{{c.spec}}</span><span class="ch t">{{c.plays}}</span></div><div class="strip" style="background:{{c.strip}}"></div><div class="lg"><i style="--c:#5eead4">{{c.n3}} Par 3</i><i style="--c:#ff4fa3">{{c.n4}} Par 4</i><i style="--c:#ffd166">{{c.n5}} Par 5</i></div><div style="display:{{c.tipDisp}}"><div class="tip">{{c.tip}}</div><div class="cp" style="margin-top:6px">{{c.tee}}{{c.src}}</div></div></button></sc-for></div>

<script>

class Component extends DCLogic {
state = { q: '', sel: '', msg: '' };
sel() { const s = this.state; return s.sel || GreencutEngine.courseSaved(); }
strip(id) { const c = GreencutEngine.courseInfo(id); const col = { 3: '#5eead4', 4: '#ff4fa3', 5: '#ffd166' }; const w = 100 / 18; const st = c.holes.map((h, i) => col[h.par] + ' ' + (i * w).toFixed(3) + '% ' + ((i + 1) * w).toFixed(3) + '%').join(','); return 'repeating-linear-gradient(90deg,transparent 0 calc(' + w.toFixed(3) + '% - 2px),#140a33 calc(' + w.toFixed(3) + '% - 2px) ' + w.toFixed(3) + '%),linear-gradient(90deg,' + st + ')'; }
renderVals() {
  const s = this.state; const sel = this.sel(); const all = GreencutEngine.courseSearch(s.q); const fmt = (n) => GreencutEngine.fmt(n);
  const ok = all.filter((c) => c.status === 'ok').map((c, i) => { const info = GreencutEngine.courseInfo(c.id); const on = c.id === sel; return { id: c.id, rank: String(i + 1), name: c.name, place: c.place + ' · ' + c.country, spec: 'Par ' + c.par + ' · ' + fmt(c.yds) + ' yds', plays: fmt(c.plays) + ' parties jouées', n3: String(c.n3), n4: String(c.n4), n5: String(c.n5), strip: this.strip(c.id), cls: on ? 'on' : '', pressed: on ? 'true' : 'false', tipDisp: on ? 'block' : 'none', tip: c.tip, tee: info.tee, src: info.source ? ' · données : ' + info.source : '', pick: () => this.setState({ sel: c.id, msg: '' }) }; });
