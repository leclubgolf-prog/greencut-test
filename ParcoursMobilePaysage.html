<sc-if value="{{xo.hasCards}}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap"><div><div class="mu up" style="font-size:11px;font-weight:700;margin-bottom:5px">Votre main</div><div style="display:flex;gap:6px"><sc-for list="{{xo.hand}}" as="c" hint-placeholder-count="5"><div class="mc {{c.cls}}" style="font-size:9px"><b>{{c.rank}}</b><i>{{c.name}}</i><u>{{c.zone}}</u></div></sc-for></div></div><div><div class="mu up" style="font-size:11px;font-weight:700;margin-bottom:5px">Cartes communes</div><div style="display:flex;gap:5px"><sc-for list="{{xo.comm}}" as="c" hint-placeholder-count="5"><div class="mc {{c.cls}}" style="font-size:9px"><b>{{c.rank}}</b><i>{{c.name}}</i><u>{{c.zone}}</u></div></sc-for></div></div></div></sc-if>
<div style="font-size:16px;font-weight:700;line-height:1.45;margin-top:12px;white-space:pre-line">{{xo.q}}</div>
<sc-for list="{{xo.opts}}" as="op" hint-placeholder-count="4"><button class="opt {{op.cls}}" onClick="{{op.pick}}">{{op.label}}</button></sc-for>
<sc-if value="{{xo.answered}}" hint-placeholder-val="{{ false }}"><div style="margin-top:12px;padding:12px 14px;border-radius:10px;background:#0e0626;border:1.5px solid {{xo.fbColor}}"><div style="font-size:16px;font-weight:900;color:{{xo.fbColor}}">{{xo.fbTitle}}</div><div style="font-size:14px;line-height:1.5;margin-top:4px;white-space:pre-line">{{xo.expl}}</div></div></sc-if></div></sc-for>
<div style="margin:4px 0 12px;font-size:15px;font-weight:700;color:#ffd166;line-height:1.4">{{exoLine}}</div><button class="gc-btn gc-btn--primary gc-btn--block {{toCheckCls}}" onClick="{{go2}}">Passer à la validation →</button></sc-if>
<sc-if value="{{showCheck}}" hint-placeholder-val="{{ false }}">
<div class="gc-panel gc-panel--compact" style="padding:14px;margin-bottom:12px"><div class="gd" style="font-size:17px;font-weight:900">Vous avez compris cette marche quand…</div><div class="mu" style="font-size:13px;margin-top:2px">Cochez honnêtement : si un point vous paraît flou, retournez voir la leçon.</div><sc-for list="{{checks}}" as="ck" hint-placeholder-count="3"><button class="ck {{ck.cls}}" onClick="{{ck.pick}}" style="font-size:15px"><span class="bx">{{ck.mark}}</span><span>{{ck.label}}</span></button></sc-for></div>
<div class="gc-panel gc-panel--compact" style="padding:14px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap"><span class="gc-chip {{exoCls}}">Exercices : {{exoDone}} / {{exoTotal}}</span><span class="gc-chip {{chkCls}}">Points cochés : {{chkDone}} / {{chkTotal}}</span></div>
<button class="gc-btn gc-btn--primary gc-btn--block {{valCls}}" onClick="{{validate}}" style="font-size:17px">{{valLabel}}</button>
<sc-if value="{{justDone}}" hint-placeholder-val="{{ false }}"><div class="gc-panel gc-panel--compact" style="padding:14px;margin-bottom:12px;margin-top:12px;border-color:#5eead4"><div class="t" style="font-size:22px">Bravo, marche validée !</div><div style="font-size:15px;line-height:1.5;margin-top:4px">{{doneMsg}}</div><div class="mu" style="font-size:13px;margin-top:8px">{{aideNote}}</div><button class="gc-btn gc-btn--primary gc-btn--block" onClick="{{nextM}}" style="margin-top:12px">{{nextLabel}}</button></div></sc-if></sc-if>
</div></div><sc-if value="{{drawer}}" hint-placeholder-val="{{ false }}"><div class="dr"><div style="flex:none;padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #ff4fa3"><div style="flex:1"><div class="mu up" style="font-size:11px;font-weight:700">Parcours d'apprentissage</div><div class="t" style="font-size:18px">Votre carte du parcours</div></div><button class="gc-chip gc-chip--tap" onClick="{{closeDr}}" style="font-size:14px">Fermer ✕</button></div>
<div class="sc" style="padding:12px 16px"><div style="height:8px;border-radius:99px;background:#2a1f4a;margin-bottom:10px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#ffd166,#ff4fa3);width:{{progressPct}}%"></div></div>
<span class="gc-chip gc-chip--on" style="font-size:13px;margin-bottom:10px">{{doneCount}} / {{total}} marches validées</span> <button class="gc-chip gc-chip--tap {{allCls}}" onClick="{{toggleAll}}" style="margin-bottom:10px;font-size:13px">{{allLabel}}</button>
<sc-for list="{{marches}}" as="mp" hint-placeholder-count="9"><button class="mp {{mp.cls}}" onClick="{{mp.pick}}"><span class="dot {{mp.dotCls}}">{{mp.dot}}</span><span style="flex:1"><span class="mu up" style="display:block;font-size:11px;font-weight:700">{{mp.palier}}</span><span style="display:block;font-size:16px;font-weight:900;line-height:1.15">{{mp.title}}</span></span></button></sc-for></div></div></sc-if></div>
</script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
let done = {}; let all = false; try { const d = JSON.parse(localStorage.getItem('greencut.parcours') || '{}'); done = d.done || {}; all = !!d.expert; } catch (x) { done = {}; }
this.state = { m: 0, step: 0, ans: {}, checks: {}, done, tip: 'golf', all, just: false, drawer: false };
}
cardList() { return GreencutEngine.cards(); }
cv(names, marks) {
const L = this.cardList();
return names.map((n, i) => { let k = 1; for (; k < L.length; k++) { if (L[k][0] === n) { break; } } const c = L[k]; return { rank: k, name: c[1], zone: c[2], cls: c[3], mark: marks && marks[i] ? 'in' : '' }; });
}
data() {
const T = (head, rows) => ({ head, rows });
return [
{ id: '1a', palier: 'Palier 1 · Marche 1a', palierName: 'Poker golf', title: 'Les combinaisons classiques',
goal: 'Apprendre à lire vos 7 cartes (2 en main + 5 communes) et à les transformer en score de golf. Pas de mises, pas de jetons : seulement les combinaisons.',
tips: [ { k: 'golf', label: 'du golf', text: 'Votre main = vos 2 cartes cachées. Les cartes communes = les 5 cartes au centre. Le Caddy Master distribue, comme le dealer au poker. Dans ce palier, vous n’avez rien à miser.' },
{ k: 'poker', label: 'du poker', text: 'Le par est le nombre de coups de référence d’un trou (3, 4 ou 5). Bogey = par + 1, birdie = par − 1, eagle = par − 2, albatross = par − 3. Moins vous avez de coups, mieux c’est.' } ],
blocks: [
{ h: '1. Un trou, étape par étape', t: 'Le Caddy Master donne 2 cartes cachées à chaque joueur : c’est votre main.\nIl pose 5 cartes visibles au centre : les cartes communes, les mêmes pour tous.\nChacun cherche sa meilleure combinaison avec ses 2 cartes et les 5 cartes communes, l’annonce et note son score.' },
{ h: '2. La règle d’or', t: 'Une combinaison compte uniquement si elle utilise au moins une de vos 2 cartes en main. Les cartes communes seules ne valent rien. Vous ne retenez que votre meilleure combinaison.' },
{ h: '3. Combinaisons et scores', t: 'Du plus faible au plus fort : Paire < Double paire < Brelan < Full < Carré. (Les séries s’intercalent à la marche 1b.)',
table: T(['Combinaison', 'Score golf', 'Par 3', 'Par 4', 'Par 5'], [['Paire', 'Bogey', '4', '5', '6'], ['Double paire', 'Par', '3', '4', '5'], ['Brelan', 'Birdie', '2', '3', '4'], ['Full', 'Eagle', '1', '2', '3'], ['Carré', 'Albatross', '1', '1', '2'], ['Carré de Hole in one', 'Trou en 1', '1', '1', '1']]) },
{ h: '4. Et si je n’ai rien ?', t: 'Aucune combinaison : vous marquez le par + 4 (quadruple bogey). Plus tard, le bluff permettra d’éviter ce +4.' } ],
examples: [
{ par: 4, hand: ['Wood water', 'One putt'], comm: ['Wood water', 'Iron bunker', 'Drive fairway', 'Two putt', 'Approach in hole'], hm: [1, 0], cm: [1, 0, 0, 0, 0], text: 'Wood water est dans votre main et dans les cartes communes : une paire, qui utilise une carte de votre main.\nPaire = Bogey = 5 coups.' },
{ par: 4, hand: ['Hole in one', 'Iron water'], comm: ['One putt', 'One putt', 'Drive fairway', 'Approach green', 'Wood water'], hm: [0, 0], cm: [0, 0, 0, 0, 0], text: 'La paire de One putt est uniquement dans les cartes communes : elle ne compte pas.\nAucune combinaison avec vos cartes : par + 4 = 8 coups.' } ],
mistakes: '• Utiliser une combinaison faite uniquement avec les cartes communes.\n• Confondre « eagle » et « 2 coups » : eagle = 2 coups de moins que le par (1 coup sur par 3, 2 coups sur par 4).\n• Mal former un full : 3 cartes identiques + 2 autres cartes identiques entre elles.',
exos: [
{ par: 4, hand: ['Big drive', 'One putt'], comm: ['Big drive', 'Big drive', 'Drive water', 'Wood fairway', 'Iron bunker'], q: 'Quelle est votre meilleure combinaison et votre score ?', opts: ['Brelan de Big drive : Birdie, 3 coups', 'Paire de Big drive : Bogey, 5 coups', 'Brelan de Big drive : Birdie, 2 coups', 'Aucune combinaison : 8 coups'], ok: 0, expl: 'Une Big drive dans votre main + deux dans les cartes communes = brelan. Birdie = par − 1 = 3 coups sur un par 4.' },
{ par: 3, hand: ['Two putt', 'Iron water'], comm: ['Two putt', 'Two putt', 'Iron water', 'Drive fairway', 'Approach in hole'], q: 'Quelle est votre meilleure combinaison et votre score ?', opts: ['Brelan de Two putt : Birdie, 2 coups', 'Full (3 × Two putt + 2 × Iron water) : 1 coup', 'Double paire : Par, 3 coups', 'Carré de Two putt : 1 coup'], ok: 1, expl: 'Full = Eagle. Sur un par 3, on ne peut pas descendre sous 1 coup : 1 coup.' } ],
checks: ['je repère paire, double paire, brelan, full et carré dans mes 7 cartes ;', 'je sais qu’une paire des cartes communes seules ne compte pas ;', 'j’annonce mon score en coups en moins de 30 secondes.' ] },

{ id: '1b', palier: 'Palier 1 · Marche 1b', palierName: 'Poker golf', title: 'Les séries',
goal: 'Découvrir les familles de cartes : une série réunit toutes les cartes d’une même famille. Ce n’est pas une quinte : pas de cartes qui se suivent, pas de couleur.',
blocks: [
{ h: '1. Chaque carte a deux sens', t: 'Une carte GREENCUT représente un club (le coup que vous jouez) et une zone (l’endroit où la balle arrive). Exemple : Wood fairway = un coup de bois qui arrive sur le fairway.' },
{ h: '2. Les familles', t: 'Une famille regroupe les cartes qui partagent un même mot. Une carte peut appartenir à deux familles (son club et sa zone).',
table: T(['Famille', 'Cartes', 'Nb'], [['Drive', 'Big drive, Drive fairway, Drive water', '3'], ['Wood', 'Wood green, Wood fairway, Wood water', '3'], ['Putt', 'One putt, Two putt, Three putt', '3'], ['Fairway', 'Drive, Wood, Iron fairway', '3'], ['Water', 'Drive, Wood, Iron water', '3'], ['Hole', 'Hole in one, Approach in hole, Bunker in hole', '3'], ['Bunker', 'Iron bunker, Bunker in hole, Bunker green', '3'], ['Iron', 'Iron green, fairway, bunker, water', '4'], ['Green', 'Wood green, Iron green, Approach green, Bunker green', '4'], ['Approach', 'Approach in hole, Approach green', '2 · pas de série']]) },
{ h: '3. La série', t: 'Une série = toutes les cartes d’une famille, différentes entre elles. Elle utilise au moins une carte de votre main. Une même carte peut servir dans deux séries.\nHiérarchie complète : Paire < Double paire < Série de 3 < Brelan < Série de 4 < Full < Carré.',
table: T(['Combinaison', 'Score golf', 'Par 3', 'Par 4', 'Par 5'], [['Série de 3', 'Par', '3', '4', '5'], ['Série de 4', 'Eagle', '1', '2', '3']]) } ],
examples: [
{ par: 4, hand: ['Wood fairway', 'Iron fairway'], comm: ['Drive fairway', 'Wood water', 'Approach green', 'Iron bunker', 'One putt'], hm: [1, 1], cm: [1, 0, 0, 0, 0], text: 'Vous avez les 3 cartes de la famille Fairway (Drive, Wood, Iron), et vos deux cartes en main y participent.\nSérie de 3 = Par = 4 coups.' },
{ par: 5, hand: ['Wood green', 'Two putt'], comm: ['Wood green', 'Iron green', 'Approach green', 'Two putt', 'Drive water'], hm: [1, 1], cm: [1, 0, 0, 1, 0], text: 'Double paire (Wood green et Two putt) = Par = 5 coups.\nIl ne manque que Bunker green pour une série de 4 Green : presque !' } ],
mistakes: '• Chercher une série Approach : cette famille n’a que 2 cartes, elle n’a pas de série.\n• Confondre série et brelan : une série = des cartes différentes d’une même famille.\n• Compter deux fois la même carte : deux Wood fairway ne font pas deux cartes de la famille Wood.\n• Oublier qu’une carte compte dans deux familles (Wood fairway : Wood et Fairway).',
exos: [
{ par: 3, hand: ['Iron water', 'Drive water'], comm: ['Wood water', 'Two putt', 'Iron fairway', 'Hole in one', 'Wood green'], q: 'Quelle est votre meilleure combinaison et votre score ?', opts: ['Série de 3 Water : Par, 3 coups', 'Série de 4 : Eagle, 1 coup', 'Paire : Bogey, 4 coups', 'Aucune combinaison : 7 coups'], ok: 0, expl: 'Drive water + Wood water + Iron water = les 3 cartes de la famille Water. Série de 3 = Par = 3 coups sur un par 3.' },
{ par: 5, hand: ['Approach green', 'Bunker green'], comm: ['Wood green', 'Iron green', 'Three putt', 'Approach green', 'Drive fairway'], q: 'Quelle est votre meilleure combinaison et votre score ?', opts: ['Série de 4 Green : Eagle, 3 coups', 'Paire d’Approach green : Bogey, 6 coups', 'Série de 3 Green : Par, 5 coups', 'Série Approach : Par, 5 coups'], ok: 0, expl: 'Wood green, Iron green, Approach green et Bunker green = les 4 cartes de la famille Green. Eagle = 3 coups sur un par 5. La paire d’Approach est moins forte : on ne retient que la meilleure combinaison.' } ],
checks: ['je repère une série sans chercher dans la liste ;', 'je sais qu’une carte peut compter dans deux familles ;', 'je ne cherche plus de série Approach.'] },

{ id: '2a', palier: 'Palier 2 · Marche 2a', palierName: 'Combinaisons golf', title: 'Le par 3',
goal: 'Jouer un vrai trou avec vos cartes : enchaîner DÉPART → coups INTERMÉDIAIRES → coup FINAL. On commence par le par 3, le plus simple : un seul coup pour atteindre le green.',
blocks: [
{ h: 'Le principe : une chaîne de cartes', t: 'Une combinaison golf est une chaîne qui raconte votre trou : DÉPART → INTERMÉDIAIRE → FINAL.\nLe rôle de chaque carte est inscrit sur la carte : le bandeau DÉPART / INTERMÉD. / FINAL s’allume selon le par.' },
{ h: 'Compter ses coups', t: '• Chaque carte = 1 coup.\n• Une carte water = 2 coups (le coup + la pénalité).\n• One putt = 1, Two putt = 2, Three putt = 3 : vous utilisez le putt que vous avez.\n• Hole in one = 1 coup.\nVotre score = le total des coups de la chaîne. Moins il y en a, mieux c’est.' },
{ h: 'Les règles du palier', t: '• Au moins une carte de votre main dans la chaîne.\n• Une carte ne sert qu’une fois (deux cartes identiques peuvent servir deux fois).\n• Golf ou poker ? Gardez le plus petit nombre de coups. À égalité, le golf passe avant le poker.' },
{ h: 'Les 5 recettes du par 3', t: 'Départ possible : Wood ou Iron (Big drive, Drive, Approach, Bunker et Putt ne servent pas de départ sur un par 3).',
table: T(['Recette', 'Chaîne', 'Coups'], [['A. Direct au green', 'Wood green ou Iron green → putt', '2 · 3 · 4'], ['B. Par le fairway', 'Wood/Iron fairway → Approach in hole', '2'], ['', 'Wood/Iron fairway → Approach green → putt', '3 · 4 · 5'], ['C. Par le bunker', 'Iron bunker → Bunker in hole', '2'], ['', 'Iron bunker → Bunker green → putt', '3 · 4 · 5'], ['D. Par l’eau (+1)', 'Wood/Iron water → Approach in hole', '3'], ['E. Le grand coup', 'Hole in one seule, dans votre main', '1']]) } ],
examples: [
{ par: 3, hand: ['Iron fairway', 'Approach green'], comm: ['Two putt', 'Wood water', 'Drive fairway', 'Iron water', 'Three putt'], hm: [1, 1], cm: [1, 0, 0, 0, 0], text: 'Iron fairway → Approach green → Two putt = 1 + 1 + 2 = 4 coups = Bogey.\n(Le Three putt ferait 5 : on prend le meilleur putt.)' },
{ par: 3, hand: ['Wood green', 'One putt'], comm: ['Iron bunker', 'Hole in one', 'Two putt', 'Drive water', 'Approach in hole'], hm: [1, 1], cm: [0, 0, 0, 0, 0], text: 'Wood green → One putt = 2 coups = Birdie.\nLe Hole in one est dans les cartes communes : il ne compte pas, car il n’est pas dans votre main.' } ],
mistakes: '',
exos: [
{ par: 3, hand: ['Iron bunker', 'Bunker green'], comm: ['One putt', 'Two putt', 'Wood water', 'Drive fairway', 'Iron fairway'], q: 'Quelle est votre meilleure chaîne et votre score ?', opts: ['Iron bunker → Bunker green → One putt : 3 coups, Par', 'Iron bunker → Bunker green → Two putt : 4 coups, Bogey', 'Iron bunker → Bunker in hole : 2 coups, Birdie', 'Aucune chaîne : 7 coups'], ok: 0, expl: 'Départ Iron bunker (1) → Bunker green (1) → putt. Le One putt (1) donne 3 coups = Par ; le Two putt ferait 4.' },
{ par: 3, hand: ['Wood green', 'Three putt'], comm: ['Two putt', 'Iron green', 'Hole in one', 'Approach in hole', 'Wood fairway'], q: 'Quelle est votre meilleure chaîne et votre score ?', opts: ['Wood green → Two putt : 3 coups, Par', 'Hole in one seule : 1 coup, Eagle', 'Wood fairway → Approach in hole : 2 coups, Birdie', 'Wood green → Three putt : 4 coups, Bogey'], ok: 0, expl: 'Hole in one et Wood fairway + Approach in hole sont entièrement dans les cartes communes : elles ne comptent pas. Reste Wood green (votre main) + Two putt = 3 coups = Par.' } ],
checks: ['j’enchaîne spontanément départ → arrivée → putt ;', 'je compte une carte water pour 2 coups ;', 'je sais que Hole in one doit être dans ma main.'] },

{ id: '2b', palier: 'Palier 2 · Marche 2b', palierName: 'Combinaisons golf', title: 'Le par 4',
goal: 'Un par 4 demande deux coups pour atteindre le green. Les fers sont trop courts pour partir : on part avec un Drive, un Big drive ou un Wood. Et vous découvrez la carte joker.',
blocks: [
{ h: 'Les départs d’un par 4', t: 'Big drive, Drive fairway, Drive water, Wood fairway, Wood water. Les cartes Iron et Hole in one ne partent pas sur un par 4.' },
{ h: 'Big drive : la carte joker', t: 'Big drive est un coup de départ surpuissant. Vous choisissez sa zone selon les cartes qui suivent.',
table: T(['Zone choisie', 'Carte qui suit', 'Coups'], [['Green', 'Putt (One / Two / Three)', '2 · 3 · 4'], ['Fairway', 'Approach in hole', '2'], ['Fairway', 'Approach green → putt', '3 · 4 · 5'], ['Bunker', 'Bunker in hole', '2'], ['Bunker', 'Bunker green → putt', '3 · 4 · 5']]) },
{ h: 'Les recettes (coups avec un départ fairway)', t: 'Chaque carte water à la place d’une carte fairway ajoute 1 coup. Ce tableau est une aide de lecture : inutile de l’apprendre par cœur.',
table: T(['Recette', 'Chaîne', 'Coups'], [['Drive + approche', 'Drive fairway → Approach in hole', '2'], ['', 'Drive fairway → Approach green / Iron green / Wood green → putt', '3 · 4 · 5'], ['Drive + bunker', 'Drive fairway → Iron bunker → Bunker in hole', '3'], ['Drive + fer', 'Drive fairway → Iron fairway → Approach in hole', '3'], ['Wood + green', 'Wood fairway → Wood green / Iron green → putt', '3 · 4 · 5']]) } ],
examples: [
{ par: 4, hand: ['Big drive', 'Wood fairway'], comm: ['Two putt', 'Three putt', 'Approach in hole', 'Iron green', 'Drive water'], hm: [1, 0], cm: [0, 0, 1, 0, 0], text: 'Big drive en zone fairway → Approach in hole = 2 coups = Eagle.\nEn zone green, Big drive + Two putt ferait 3 : le choix de la zone fait la différence.' },
{ par: 4, hand: ['Wood water', 'Iron green'], comm: ['One putt', 'Two putt', 'Approach green', 'Iron fairway', 'Hole in one'], hm: [1, 1], cm: [1, 0, 0, 0, 0], text: 'Wood water → Iron green → One putt = 2 + 1 + 1 = 4 coups = Par.\nRallonger avec Iron fairway ferait 5.' } ],
mistakes: '',
exos: [
{ par: 4, hand: ['Drive water', 'Iron bunker'], comm: ['Bunker in hole', 'Two putt', 'Wood green', 'One putt', 'Approach green'], q: 'Quel est le meilleur score possible avec ces cartes ?', opts: ['4 coups : Par', '3 coups : Birdie', '5 coups : Bogey', 'Aucune chaîne : 8 coups'], ok: 0, expl: 'Drive water compte 2 coups. Exemples à 4 coups : Drive water → Iron bunker → Bunker in hole ; Drive water → Wood green → One putt ; Drive water → Approach green → One putt. Aucun chemin ne fait 3.' },
{ par: 4, hand: ['Wood fairway', 'Wood water'], comm: ['Approach in hole', 'Two putt', 'Iron water', 'Iron green', 'One putt'], q: 'Quel est le meilleur score possible avec ces cartes ?', opts: ['3 coups : Birdie (Wood fairway → Iron green → One putt)', '4 coups : Par (Wood water → Approach in hole)', '2 coups : Eagle', '5 coups : Bogey'], ok: 0, expl: 'Wood fairway → Iron green → One putt = 1 + 1 + 1 = 3 coups = Birdie. Le chemin par Wood water et Approach in hole ferait 4.' } ],
checks: ['je sais choisir la zone de Big drive ;', 'je distingue les départs d’un par 4 (pas de Iron) de ceux d’un par 3 ;', 'je compare deux chaînes et garde la plus courte.'] },

{ id: '2c', palier: 'Palier 2 · Marche 2c', palierName: 'Combinaisons golf', title: 'Le par 5',
goal: 'Le trou le plus long : trois coups avant le green. Big drive est la seule carte qui raccourcit le chemin.',
blocks: [
{ h: 'Les départs d’un par 5', t: 'Big drive, Drive fairway, Drive water, Wood fairway, Wood water.' },
{ h: 'Big drive sur par 5', t: 'Sur un par 5, Big drive atterrit sur le fairway ou dans un bunker, jamais sur le green. Un seul coup suffit ensuite.',
table: T(['Carte qui suit Big drive', 'Coups', 'Score'], [['Approach in hole ou Bunker in hole', '2', 'Albatross'], ['Approach / Bunker green, Iron green ou Wood green → putt', '3 · 4 · 5', 'Eagle · Birdie · Par']]) },
{ h: 'Les recettes', t: 'Même principe : +1 coup par carte water. La table complète des 355 chaînes sert de référence en cas de doute.',
table: T(['Recette', 'Chaîne', 'Coups'], [['Drive + Wood', 'Drive fairway → Wood fairway → Approach in hole', '3'], ['', 'Drive fairway → Wood fairway → Approach green / Iron green / Wood green → putt', '4 · 5 · 6'], ['Wood + Wood', 'Wood fairway → Wood fairway → Approach in hole', '3'], ['Chemin des fers', 'Drive fairway → Iron fairway → Iron fairway → Approach in hole', '4']]) } ],
examples: [
{ par: 5, hand: ['Big drive', 'Wood green'], comm: ['One putt', 'Two putt', 'Approach in hole', 'Drive water', 'Iron bunker'], hm: [1, 0], cm: [0, 0, 1, 0, 0], text: 'Big drive (zone fairway) → Approach in hole = 2 coups = Albatross.\nBig drive → Wood green → One putt ne ferait que 3 coups.' },
{ par: 5, hand: ['Wood water', 'Iron fairway'], comm: ['Wood green', 'One putt', 'Two putt', 'Drive water', 'Iron bunker'], hm: [1, 1], cm: [1, 1, 0, 0, 0], text: 'Wood water → Iron fairway → Wood green → One putt = 2 + 1 + 1 + 1 = 5 coups = Par.' } ],

const AC = typeof window !== 'undefined' ? (window.AudioContext || window.webkitAudioContext) : null; if (!AC) { return; }
if (!this._ac) { this._ac = new AC(); this._mg = this._ac.createGain(); this._mg.connect(this._ac.destination); }
const ac = this._ac; if (ac.state === 'suspended') { ac.resume(); }
this._mg.gain.value = (vol / 100) * 0.5; const t0 = ac.currentTime + 0.02;
const tone = (f, st, d, type, g) => { const o = ac.createOscillator(); const gg = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + st); gg.gain.setValueAtTime(0.0001, t0 + st); gg.gain.exponentialRampToValueAtTime(g, t0 + st + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + st + d); o.connect(gg); gg.connect(this._mg); o.start(t0 + st); o.stop(t0 + st + d + 0.05); };
if (kind === 'enter') { [262, 330, 392].forEach((f) => { tone(f, 0, 0.7, 'sawtooth', 0.05); }); tone(1047, 0.05, 0.4, 'triangle', 0.14); tone(1319, 0.14, 0.45, 'triangle', 0.12); }
else { [523, 659, 784, 1047].forEach((f, i) => { tone(f, i * 0.11, 0.4, 'triangle', 0.26); }); }
} catch (x) { /* son facultatif */ }
}
