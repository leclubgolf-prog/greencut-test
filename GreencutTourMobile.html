<sc-if value="{{isRules}}" hint-placeholder-val="{{ false }}">
<section class="panel rules">
<div class="lbl">Règlement du Greencut Tour · s’applique à chaque tournoi</div>
<h2 class="h2">Les règles du tournoi</h2>
<p class="p">Un tournoi Greencut se joue comme un tournoi du DP World Tour : 4 tours en 4 jours, un cut après 2 tours, une dotation pour les qualifiés. À la table, ce sont les règles habituelles de Greencut.</p>
<div class="step"><span class="badge">1</span><div><h3 class="h3">4 jours, 4 tours, du jeudi au dimanche</h3><p class="p">Chaque jour est un tour, ouvert de 00:00 à 23:59 (heure de Paris). Une carte commencée avant 23:59 compte pour ce jour si elle est terminée avant 00:59. Le cut est publié samedi à 01:00.</p></div></div>
<div class="step"><span class="badge">2</span><div><h3 class="h3">Autant de cartes que vous voulez : la meilleure compte</h3><p class="p">Chaque carte est une partie Greencut de 18 trous sur le parcours du tournoi, à une table de 4 à 6 joueurs. Mise de 10 000 pts par carte, prise sur votre solde avec votre accord ; vos jetons restants reviennent sur votre solde à la fin. Sous 10 000 pts, vous convertissez 100 fees en 10 000 pts. Seule votre meilleure carte du jour (au net) compte.</p></div></div>
<div class="step"><span class="badge">3</span><div><h3 class="h3">Le score du tournoi</h3><p class="p">Score d’un tour = net de la carte retenue : coups joués + bonus de jetons de la table (−4, −2, −1 pour les 3 premiers en jetons, +2 pour les autres), par rapport au par. Le classement officiel est au net ; le brut s’affiche pour information. Pas de mise, pas de tournoi : un joueur qui n’engage pas la mise de départ d’un tour est en abandon (ABD) : par + 2 sur les trous restants, plus de tour suivant, aucune dotation.</p></div></div>
<div class="step"><span class="badge">4</span><div><h3 class="h3">Le cut : toujours 50 qualifiés</h3><p class="p">Après le tour 2, les 50 premiers jouent le week-end. À égalité sur la 50e place : 1) brut cumulé des tours 1 et 2, 2) net du tour 2, 3) brut des 9 derniers trous du tour 2, 4) heure de dépôt de la carte retenue (la plus tôt passe). Il n’y a jamais d’égalité sur la ligne.</p></div></div>
<div class="step"><span class="badge">5</span><div><h3 class="h3">Tours 3 et 4 et résultat</h3><p class="p">Seuls les 50 qualifiés jouent samedi et dimanche. Classement final au net cumulé des 4 tours. Pour la victoire, on départage au brut cumulé, puis au tour 4, puis aux 9 derniers trous du tour 4, puis à l’heure de dépôt. Les autres égalités sont partagées (« T7 »).</p></div></div>
<div class="step"><span class="badge">6</span><div><h3 class="h3">La dotation</h3><p class="p">2 000 000 pts partagés entre les 50 qualifiés (10 000 pts minimum chacun, puis une part selon le rang), plus les lots Callaway. Les points sont crédités le lundi sur votre solde.</p><button class="lnk" onClick="{{goPurse}}">Voir le barème complet →</button></div></div>
</section>
</sc-if>

<sc-if value="{{isPurse}}" hint-placeholder-val="{{ false }}">
<section class="grid2">
<div class="panel">
<div class="lbl">Dotation en points</div><div class="sport big2 gold">{{purse}}</div><div class="muted sm-t">{{purseFees}} · 50 qualifiés · minimum garanti 10 000 pts</div>
<div class="step"><span class="badge">1</span><p class="p">Chaque qualifié qui a misé sur les 4 tours reçoit d’abord 10 000 pts (50 × 10 000 = 500 000 pts).</p></div>
<div class="step"><span class="badge">2</span><p class="p">Le reste ({{rest}}) se partage selon le rang : le 2e reçoit la moitié de la part du 1er, le 3e un tiers… (part = 1 ÷ rang).</p></div>
<div class="step"><span class="badge">3</span><p class="p">Arrondi à 100 pts (1 fee) ; le petit reste d’arrondi va au vainqueur. La somme est toujours égale à la dotation.</p></div>
<div class="step"><span class="badge">4</span><p class="p">Égalité : les joueurs ex aequo additionnent les points de leurs places et se les partagent (ex. deux joueurs T7 : {{tie78}} chacun). La victoire est toujours départagée.</p></div>
<div class="step"><span class="badge">5</span><p class="p">Abandon (ABD) : aucune dotation ; les joueurs classés derrière remontent et les dernières places restées libres ne sont pas versées.</p></div>
</div>
<div class="panel blk">
<div class="row-w"><a class="pmark" href="{{partnerUrl}}" target="_blank" rel="noopener" title="Site officiel Callaway (nouvel onglet)" aria-label="Callaway, site officiel (nouvel onglet)"><b>CALLAWAY</b><i>logo officiel fourni par la marque</i></a><span class="lbl plbl">Lots du partenaire exclusif</span></div>
<ul class="lots"><li><b>1er</b> Driver + fitting complet + sac Tour</li><li><b>2e</b> Série de fers avec fitting</li><li><b>3e</b> Putter Odyssey</li><li><b>4e – 10e</b> 3 douzaines de balles Chrome Tour + casquette</li><li><b>11e – 50e</b> 1 douzaine de balles Chrome Tour</li><li><b>Prix spécial</b> Meilleure carte du tournoi : gant + housse</li></ul>
<p class="muted sm-t">Lots à confirmer avec Callaway, sans valeur en euros.</p>
</div>
</section>
<section class="panel"><h2 class="h2">Barème complet</h2><div class="pay"><table><thead><tr><th>Place</th><th class="num">Points</th><th class="num">Fees</th></tr></thead><tbody><sc-for list="{{payA}}" as="it" hint-placeholder-count="3"><tr class="{{it.z}}"><td>{{it.r}}</td><td class="num">{{it.p}}</td><td class="num">{{it.fe}}</td></tr></sc-for></tbody></table><table><thead><tr><th>Place</th><th class="num">Points</th><th class="num">Fees</th></tr></thead><tbody><sc-for list="{{payB}}" as="it" hint-placeholder-count="3"><tr class="{{it.z}}"><td>{{it.r}}</td><td class="num">{{it.p}}</td><td class="num">{{it.fe}}</td></tr></sc-for></tbody></table></div></section>
</sc-if>

<script id="th" type="text/plain">

<div class="gc gt">

<sc-if value="{{isRules}}" hint-placeholder-val="{{ false }}">

<h2 class="h2">Les règles du tournoi</h2>
<p class="p">Un tournoi Greencut se joue comme un tournoi du DP World Tour : 4 tours en 4 jours, un cut après 2 tours, une dotation pour les qualifiés. À la table, ce sont les règles habituelles de Greencut.</p>
<div class="step"><span class="badge">1</span><div><h3 class="h3">4 jours, 4 tours, du jeudi au dimanche</h3><p class="p">Chaque jour est un tour, ouvert de 00:00 à 23:59 (heure de Paris). Une carte commencée avant 23:59 compte pour ce jour si elle est terminée avant 00:59. Le cut est publié samedi à 01:00.</p></div></div>
<div class="step"><span class="badge">2</span><div><h3 class="h3">Autant de cartes que vous voulez : la meilleure compte</h3><p class="p">Chaque carte est une partie Greencut de 18 trous sur le parcours du tournoi, à une table de 4 à 6 joueurs. Mise de 10 000 pts par carte, prise sur votre solde avec votre accord ; vos jetons restants reviennent sur votre solde à la fin. Sous 10 000 pts, vous convertissez 100 fees en 10 000 pts. Seule votre meilleure carte du jour (au net) compte.</p></div></div>
<div class="step"><span class="badge">3</span><div><h3 class="h3">Le score du tournoi</h3><p class="p">Score d’un tour = net de la carte retenue : coups joués + bonus de jetons de la table (−4, −2, −1 pour les 3 premiers en jetons, +2 pour les autres), par rapport au par. Le classement officiel est au net ; le brut s’affiche pour information. Pas de mise, pas de tournoi : un joueur qui n’engage pas la mise de départ d’un tour est en abandon (ABD) : par + 2 sur les trous restants, plus de tour suivant, aucune dotation.</p></div></div>
<div class="step"><span class="badge">4</span><div><h3 class="h3">Le cut : toujours 50 qualifiés</h3><p class="p">Après le tour 2, les 50 premiers jouent le week-end. À égalité sur la 50e place : 1) brut cumulé des tours 1 et 2, 2) net du tour 2, 3) brut des 9 derniers trous du tour 2, 4) heure de dépôt de la carte retenue (la plus tôt passe). Il n’y a jamais d’égalité sur la ligne.</p></div></div>
<div class="step"><span class="badge">5</span><div><h3 class="h3">Tours 3 et 4 et résultat</h3><p class="p">Seuls les 50 qualifiés jouent samedi et dimanche. Classement final au net cumulé des 4 tours. Pour la victoire, on départage au brut cumulé, puis au tour 4, puis aux 9 derniers trous du tour 4, puis à l’heure de dépôt. Les autres égalités sont partagées (« T7 »).</p></div></div>
<div class="step"><span class="badge">6</span><div><h3 class="h3">La dotation</h3><p class="p">2 000 000 pts partagés entre les 50 qualifiés (10 000 pts minimum chacun, puis une part selon le rang), plus les lots Callaway. Les points sont crédités le lundi sur votre solde.</p><button class="lnk" onClick="{{goPurse}}">Voir le barème complet →</button></div></div>

<script>

class Component extends DCLogic {
constructor(props) {
super(props);
const ab0 = GreencutEngine.settleAbandoned ? GreencutEngine.settleAbandoned() : '';
const U = GreencutEngine.tour; const W = GreencutEngine.wallet; if (!W.saved()) { W.set(W.get()); }
let scr = 'home'; try { const q = (window.location.hash || '').replace('#', ''); if (['home', 'board', 'rules', 'purse', 'cal', 'cards', 'sc'].indexOf(q) >= 0) { scr = q; } } catch (x) { scr = 'home'; }
const T = U.load(); U.save(T);
this.state = { menu: false, testOpen: false, T, scr, view: Math.min(T.phase, 4), mode: 'net', msg: ab0 ? [ab0] : [], askReset: false, scRound: 0, calF: 'all', all: false, w: W.get() };
}
// V51 : la barre fixe « Jouer une carte » disparaît quand le bouton de l'encadré « Jouer pour le tournoi » est entièrement visible
// (et revient quand il est entièrement sorti de l'écran : pas de clignotement entre les deux)
playBarWatch() { if (this._pbw || typeof document === 'undefined') { return; } this._pbw = true;
  const check = () => { const b = document.querySelector('.cardplay'); const m = document.querySelector('.gt-main'); const seen = !!this.state.cardSeen;
    if (!b || !m || !b.offsetParent) { if (seen) { this.setState({ cardSeen: false }); } return; }
    const r = b.getBoundingClientRect(); const mr = m.getBoundingClientRect();
    if (!seen && r.top >= mr.top && r.bottom <= mr.bottom) { this.setState({ cardSeen: true }); }
    else if (seen && (r.top >= mr.bottom || r.bottom <= mr.top)) { this.setState({ cardSeen: false }); } };
  let raf = 0; const later = () => { if (!raf) { raf = requestAnimationFrame(() => { raf = 0; check(); }); } };
  document.addEventListener('scroll', later, true); window.addEventListener('resize', later); this._pbCheck = later; }
reload(o) { const U = GreencutEngine.tour; const T = U.load(); this.setState(Object.assign({ T, w: GreencutEngine.wallet.get() }, o || {})); }
renderVals() {
this.playBarWatch(); if (this._pbCheck) { setTimeout(this._pbCheck, 0); }
const s = this.state; const U = GreencutEngine.tour; const C = U.cfg; const T = s.T; const f = (n) => U.fmt(n); const set = (o) => () => this.setState(o);
const go = (k) => () => { this.setState({ scr: k, askReset: false }); try { window.scrollTo(0, 0); const el = document.querySelector('.gt-main'); if (el) { el.scrollTop = 0; } } catch (x) { /* rien */ } };
const ph = T.phase; const cp = U.canPlay(T); const st = U.standings(T, { round: s.view, mode: s.mode }); const me = U.standings(T, {}).me;
const nav = [['home', 'Accueil'], ['cal', 'Calendrier'], ['board', 'Classement'], ['rules', 'Règles'], ['purse', 'Dotation'], ['cards', 'Mes cartes']].map(([k, l]) => ({ label: l, cls: s.scr === k || (k === 'cards' && s.scr === 'sc') ? 'on' : '', go: go(k) }));
const tabs = [['home', 'Accueil'], ['board', 'Classement'], ['rules', 'Règles'], ['purse', 'Dotation']].map(([k, l]) => ({ label: l, cls: s.scr === k ? 'on' : '', go: go(k) }));
const gameHref = this.tourLink('game'); const playHref = gameHref + (gameHref.indexOf('?') >= 0 ? '&' : '?') + 'tour=1';
const markPlay = () => { try { localStorage.setItem('greencut.tourgo', '1'); } catch (x) { /* rien */ } };
// jours (tuiles) : terminé / en cours / à venir
const days = C.days.map((d, i) => { const r = i + 1; const state = ph > r ? 'Terminé' : (ph === r ? 'En cours' : 'À venir'); const mine = T.hero.abd && r >= T.hero.abd ? 'ABD' : (U.bestCard(T, r) ? U.signed(U.bestCard(T, r).net) : (ph > r ? (r >= 3 && T.cut && !U.qualified(T, 'me') ? 'CUT' : '—') : ''));
  return { d: C.dayShort[i] + ' ' + (21 + i) + ' janv.', r: 'Tour ' + r, state, cls: ph === r ? 'c-live' : (ph > r ? 'c-done' : 'c-soon'), who: r <= 2 ? 'Tous les inscrits' : '50 qualifiés', mine: mine ? 'Ma carte : ' + mine : '', cut: r === 2, box: ph === r ? 'day on' : 'day' }; });
// ma situation
const meTxt = !me ? '' : (me.sect === 'abd' ? 'Abandon (ABD) au tour ' + T.hero.abd + ' : fin du tournoi pour vous, sans dotation.' : (me.sect === 'cut' ? 'Cut manqué : vous terminez ' + me.pos + ' des non-qualifiés à ' + me.tot + '.' : (me.thru ? 'Vous êtes ' + me.pos + ' à ' + me.tot + ' après ' + me.thru + ' tour' + (me.thru > 1 ? 's' : '') + '.' : 'Vous n’avez pas encore de carte dans ce tournoi.')));
