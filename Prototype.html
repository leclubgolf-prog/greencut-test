andera une nouvelle mise de départ, avec votre accord.</sc-if><sc-if value="{{quitTour}}" hint-placeholder-val="{{ false }}">{{quitTourTxt}}</sc-if><sc-if value="{{quitElim}}" hint-placeholder-val="{{ false }}">Vous n’avez plus de jetons : quitter n’est <b>pas un abandon</b>. Les trous restants sont comptés par + 2, votre score est enregistré et aucune pénalité n’est appliquée. Une nouvelle partie demandera une nouvelle mise de départ, avec votre accord.</sc-if></div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="act" onClick="{{cancelQuit}}" style="height:44px;font-size:16px;padding:0 18px;background:#ff4fa3;color:#0e0626">Rester à la table</button><button class="act" onClick="{{quitGame}}" style="height:44px;font-size:16px;padding:0 18px;border-color:#b9acd6;color:#b9acd6">{{quitBtnLbl}}</button><sc-if value="{{canFoldRest}}" hint-placeholder-val="{{ true }}"><button class="act" onClick="{{foldRestAct}}" style="height:44px;font-size:16px;padding:0 18px;border-color:#5eead4;color:#5eead4">Me coucher pour le reste de la partie</button></sc-if></div><sc-if value="{{canFoldRest}}" hint-placeholder-val="{{ true }}"><p style="font-size:13px;line-height:1.4;margin:10px 0 0;color:#b9acd6">{{foldRestTxt}}</p></sc-if></div></sc-if></div></sc-if><sc-if value="{{isProfil}}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;top:0;width:1440px;height:1000px;transform:scale(.79);transform-origin:50% 64px"><div class="pn" style="position:absolute;left:40px;top:92px;width:860px;height:880px;padding:24px 30px;display:flex;flex-direction:column;gap:16px"><div class="t" style="font-size:30px">Créer mon joueur</div><div><div class="mu up" style="font-size:12px;font-weight:700;margin-bottom:8px">1 · Pseudo</div><div style="display:flex;align-items:center;gap:12px"><input class="in" aria-label="Pseudo" maxlength="14" value="{{pseudo}}" onInput="{{onPseudo}}"><button class="chip on" onClick="{{savePseudo}}" style="font-size:14px;padding:6px 16px">E
