<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="pn" style="border-color:var(--gold)"><div class="mu up" style="font-size:11px">Mon compte FEES · LeClub Golf</div><div style="font-size:30px;font-weight:900;line-height:1.1">{{feesBal}} <span class="mu" style="font-size:13px">fees</span></div><div class="mu" style="font-size:11px">Solde interrogé via l’API LeClub Golf</div></div><div class="pn" style="border-color:var(--mint)"><div class="mu up" style="font-size:11px">Mes points du jeu</div><div style="font-size:30px;font-weight:900;line-height:1.1">{{ptsBal}} <span class="mu" style="font-size:13px">pts</span></div><div class="mu" style="font-size:11px">{{inPlayTxt}}</div><div style="font-size:12px;font-weight:700;color:#ffd166;margin-top:2px">{{totalTxt}}</div></div></div>

<div class="mu" style="margin-bottom:8px">Taux : <b class="gd">100 fees = 10 000 pts du jeu</b></div>

<div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{quick}}" as="q" hint-placeholder-count="5"><button class="chip {{q.cls}}" onClick="{{q.pick}}" style="min-height:44px;padding:0 14px">{{q.name}}</button></sc-for></div><div class="mu" style="font-size:12px;margin-top:6px">Par pas de 100 fees = 1 mise de départ</div></div>

<div class="pn" style="margin-top:12px"><div class="t" style="font-size:18px">Démonstration</div><div class="mu" style="font-size:12.5px;margin:2px 0 8px">Simulez l’état de la carte LeClub Golf pour voir le blocage de la conversion.</div><div style="display:flex;gap:8px"><button class="chip {{validCls}}" onClick="{{setValid}}" style="flex:1;min-height:44px">Carte valide</button><button class="chip {{expCls}}" onClick="{{setExpired}}" style="flex:1;min-height:44px">Carte expirée</button></div></div>
